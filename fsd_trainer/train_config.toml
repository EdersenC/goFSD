[backend]
[backend.training]
python_bin = 'python'
train_script = 'fsd_trainer/src/gta_fsd/train.py'
jobs_dir = 'S:\fsd_fivem_data\training_jobs'

[backend.actuator]
request_timeout = '500ms'
stale_timeout = '250ms'
steering_gain = 1.0
throttle_gain = 1.0
throttle_floor = 0.0
speed_limit_kph = 8.0
overspeed_brake_margin_kph = 2.0
overspeed_brake = 0.25
model_brake_threshold = 0.55
reverse_lockout_speed_kph = 1.0
tick_hz = 60
url = 'http://127.0.0.1:8080'

[backend.parking_controller]
# Fail closed until this profile is measured against the active vehicle and adapter.
calibration_verified = false
calibration_profile_id = ''
vehicle_model_hash = 0
game_build = ''
adapter_version = ''
steering_convention = 'positive_wheel_is_positive_xinput'
steering_profile = [
  { wheel_steer = -1.0, command = -1.0 },
  { wheel_steer = 0.0, command = 0.0 },
  { wheel_steer = 1.0, command = 1.0 },
]
steering_feedback_gain = 0.35
steering_ki = 0.10
steering_integral_min = -0.5
steering_integral_max = 0.5
steering_slew_per_second = 4.0
speed_kp = 0.45
speed_ki = 0.12
speed_integral_min = -2.0
speed_integral_max = 2.0
max_throttle_effort = 0.65
max_brake_effort = 0.70
longitudinal_slew_per_second = 2.0
stop_probability_threshold = 0.65
stop_probability_release_threshold = 0.35
hold_speed_mps = 0.15
stop_brake_effort = 0.45
max_desired_speed_mps = 2.22
max_dt = '250ms'
plan_timeout = '400ms'
telemetry_timeout = '250ms'
estimated_actuation_latency = '50ms'
expected_horizon_dt_ms = [50, 100, 150, 200, 250, 300]

[backend.inference]
auto_load = false
planner_format = 'temporal_telemetry_gru_v2'
control_contract = 'parking_setpoint_v1'
dispatch_stride = 2
fps = 30
frame_height = 480
frame_width = 480
jpeg_quality = 90
model_device = 'cuda'
model_server_url = 'http://127.0.0.1:8090'
request_timeout = '5s'
inference_timeout = '250ms'
alignment_tolerance = '125ms'
max_frame_telemetry_skew = '75ms'
source_id = 'monitor-2'

[dataset]
data_root = 'S:\fsd_fivem_data'
future_speed_delta_clip = 2.0
future_speed_delta_normalize = true
image_height = 480
image_width = 480
window_size = 5
image_offsets = [-8, -6, -4, -2, 0]
label_tolerance = '100ms'
telemetry_offsets = [-8, -7, -6, -5, -4, -3, -2, -1, 0]
future_offsets = [1, 2, 3, 4, 5, 6]
telemetry_sample_interval_ms = 50
telemetry_feature_names = ['current_speed', 'yaw_sin', 'yaw_cos', 'yaw_rate', 'steering', 'acceleration']
control_target_names = ['desired_wheel_steer_normalized', 'desired_speed_mps', 'stop_probability']
aux_target_names = ['future_speed', 'future_speed_delta', 'future_yaw_delta', 'future_yaw_rate']
frame_stride = 2
sample_stride = 4
sync_flash_brightness_threshold = 245.0
sync_flash_frame_limit = 90
train_run_ids = []
val_run_ids = []
# Parking-setpoint training uses only successful forward-bay attempts with complete goal/outcome metadata by default.
include_failed_or_nonparking_trips = false

[dataset.target_transforms]
[dataset.target_transforms.desired_wheel_steer_normalized]
type = 'signed_cap'
clip = 1.0

[dataset.target_transforms.desired_speed_mps]
type = 'positive_cap'
clip = 2.22

[dataset.target_transforms.stop_probability]
type = 'positive_cap'
clip = 1.0

[dataset.target_transforms.future_speed]
type = 'positive_cap'
clip = 5.0

[dataset.target_transforms.future_speed_delta]
type = 'signed_cap'
clip = 2.0

[dataset.target_transforms.future_yaw_delta]
type = 'angle_cap'
clip = 45.0

[dataset.target_transforms.future_yaw_rate]
type = 'signed_cap'
clip = 10.0

[inference]
checkpoint = ''
data_root = 'S:\fsd_fivem_data'
device = 'cuda'
output_json = false
run_id = ''
sample_index = 0

[loader]
cpu_batch_size = 34
log_every_n_batches = 10
train_batch_size = 15
train_num_workers = 8
train_persistent_workers = false
train_pin_memory = true
train_prefetch_factor = 1
val_batch_size = 15
val_num_workers = 8
val_persistent_workers = false
val_pin_memory = false
val_prefetch_factor = 1
val_split = 1.0

[loader.turn_oversampling]
enabled = false
straight_weight = 0.4
light_turn_weight = 2.5
medium_turn_weight = 1.5
sharp_turn_weight = 0.4
light_turn_threshold = 0.05
medium_turn_threshold = 0.15
sharp_turn_threshold = 0.30

[output]
base_dir = 'S:\fsd_fivem_data\training_runs'

[model]
width_multiplier = 1.5
telemetry_hidden_dim = 128
dropout = 0.10

[model.visual_temporal]
enabled = true
type = 'gru'
hidden_dim = 256
num_layers = 1
bidirectional = false
dropout = 0.0

[model.horizon_decoder]
enabled = true
horizon_embed_dim = 32
hidden_dim = 256
num_layers = 2
dropout = 0.10

[state_inputs.current_speed]
enabled = true
cap = 5.0

[state_inputs.parking_target_configured]
enabled = true

[state_inputs.parking_longitudinal_error]
enabled = true
cap = 17.0

[state_inputs.parking_lateral_error]
enabled = true
cap = 3.0

[state_inputs.parking_heading_error]
enabled = true
cap = 20.0

[state_inputs.parking_distance]
enabled = false
cap = 20.0

[training]
device = 'auto'
early_stopping_metric = 'drive_score'
early_stopping_min_delta = 0.0
early_stopping_patience = 6
epochs = 150
learning_rate = 0.0005
loss_function = 'smooth_l1'
smooth_l1_beta = 0.1
aux_loss_weight = 0.4
horizon_loss_weights = [1.0, 0.9, 0.8, 0.5, 0.8, 1.0]

[training.optimizer]
name = 'adamw'
lr = 0.0005
weight_decay = 0.0001
grad_clip_norm = 1.0

[training.scheduler]
name = 'cosine'
warmup_fraction = 0.05
min_lr_ratio = 0.05

[training.ema]
enabled = true
decay = 0.999

[training.target_loss_weights]
desired_wheel_steer_normalized = 2.5
desired_speed_mps = 3.9
stop_probability = 2.5
future_speed = 1.8
future_speed_delta = 1.5
future_yaw_delta = 1.3
future_yaw_rate = 1.0
